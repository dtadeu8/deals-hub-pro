<style>
    .zap-hero {
        background: linear-gradient(135deg, #DC2626 0%, #B91C1C 50%, #2563EB 100%);
        position: relative;
        overflow: hidden;
        padding: 5rem 1.5rem;
        color: white;
    }

    /* Padrão animado de fundo */
    .zap-hero::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: 
            radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, rgba(37, 99, 235, 0.2) 0%, transparent 50%);
        animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }

    .zap-hero-container {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
        text-align: center;
    }

    .zap-hero-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 2rem;
        animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
            opacity: 1;
        }
        50% {
            transform: scale(1.1);
            opacity: 0.8;
        }
    }

    .zap-hero-title {
        font-size: 3.5rem;
        font-weight: 900;
        margin-bottom: 1.5rem;
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        line-height: 1.2;
        animation: fadeInUp 0.8s ease-out;
    }

    .zap-hero-subtitle {
        font-size: 1.5rem;
        margin-bottom: 2rem;
        opacity: 0.95;
        font-weight: 400;
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
        animation: fadeInUp 1s ease-out;
    }

    .zap-hero-cta {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        padding: 1rem 2.5rem;
        background: white;
        color: #DC2626;
        font-size: 1.25rem;
        font-weight: 700;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        animation: fadeInUp 1.2s ease-out;
    }

    .zap-hero-cta:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        background: #FEF2F2;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .zap-hero-stats {
        display: flex;
        justify-content: center;
        gap: 3rem;
        margin-top: 3rem;
        flex-wrap: wrap;
    }

    .zap-stat {
        text-align: center;
    }

    .zap-stat-number {
        font-size: 2.5rem;
        font-weight: 900;
        display: block;
        margin-bottom: 0.5rem;
    }

    .zap-stat-label {
        font-size: 1rem;
        opacity: 0.9;
    }

    @media (max-width: 768px) {
        .zap-hero {
            padding: 3rem 1.5rem;
        }

        .zap-hero-title {
            font-size: 2.5rem;
        }

        .zap-hero-subtitle {
            font-size: 1.25rem;
        }

        .zap-hero-stats {
            gap: 2rem;
        }

        .zap-stat-number {
            font-size: 2rem;
        }
    }
</style>

<section class="zap-hero" id="inicio">
    <div class="zap-hero-container">
        <!-- Ícone decorativo -->
        <svg class="zap-hero-icon" fill="white" viewBox="0 0 24 24">
            <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/>
        </svg>

        <!-- Título Principal -->
        <h1 class="zap-hero-title">
            Encontre as Melhores Ofertas<br>em Um Só Lugar
        </h1>

        <!-- Subtítulo -->
        <p class="zap-hero-subtitle">
            Produtos selecionados com os melhores preços e descontos exclusivos. Economize tempo e dinheiro!
        </p>

        <!-- Call to Action -->
        <a href="#produtos" class="zap-hero-cta">
            <span>Explorar Produtos</span>
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/>
            </svg>
        </a>

        <!-- Estatísticas -->
        <div class="zap-hero-stats">
            <div class="zap-stat">
                <span class="zap-stat-number">500+</span>
                <span class="zap-stat-label">Produtos</span>
            </div>
            <div class="zap-stat">
                <span class="zap-stat-number">50%</span>
                <span class="zap-stat-label">Descontos</span>
            </div>
            <div class="zap-stat">
                <span class="zap-stat-number">1000+</span>
                <span class="zap-stat-label">Clientes Felizes</span>
            </div>
        </div>
    </div>
</section>
